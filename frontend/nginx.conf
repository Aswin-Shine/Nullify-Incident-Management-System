# Nullify frontend: serves the React SPA and proxies /api, /ws, /health to the backend.
# The backend publishes no host port, so this is the only way in.

server {
    listen 80;
    server_name _;
    server_tokens off;   # no nginx version in the Server header or error pages

    root /usr/share/nginx/html;
    index index.html;

    # Signal batches are capped at 500 small items by the API
    client_max_body_size 2M;

    # Security headers (a location that sets its own add_header does not inherit these, so none do)
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Add Strict-Transport-Security here once TLS terminates in front of this server (S-08).

    # ── Backend routes ──────────────────────────────────────
    # "backend" resolves via Docker Compose service name
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite, never append ($proxy_add_x_forwarded_for): uvicorn trusts the first entry, so a client-sent
        # header would choose the IP the login rate limit counts. Behind a load balancer use set_real_ip_from.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Readiness for the dashboard health bar. /metrics is internal only: Prometheus scrapes
    # backend:8000 on the Docker network. API docs are disabled in production by the app.
    location = /health {
        proxy_pass       http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
    }
    location = /metrics {
        deny all;
    }

    # WebSocket: Upgrade header required; auth happens in the first message
    location /ws {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade          $http_upgrade;
        proxy_set_header    Connection       "upgrade";
        proxy_set_header    Host             $host;
        proxy_set_header    X-Forwarded-For  $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Static assets: long-lived cache ────────────────────
    # No add_header here: one would replace every server-level header above (the CSP included) for these files.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    30d;
        try_files  $uri =404;
    }

    # ── SPA fallback: all unknown paths go to index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
