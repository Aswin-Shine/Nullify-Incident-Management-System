# Nullify frontend — Nginx config
# Serves React SPA + proxies /api, /ws, /docs, /health, /metrics → backend

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase body size for signal ingestion payloads
    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    # ── Backend routes ──────────────────────────────────────
    # "backend" resolves via Docker Compose service name
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI auto-docs
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass       http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health + Prometheus metrics
    location ~ ^/(health|metrics)$ {
        proxy_pass       http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket — Upgrade header required
    location /ws {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Static assets — long-lived cache ───────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── SPA fallback — all unknown paths → index.html ──────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
