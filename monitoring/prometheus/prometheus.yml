# Prometheus for Nullify (docker compose --profile monitoring). Everything is scraped on the internal network;
# nginx keeps /metrics off the public side.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nullify-backend   # all 4 uvicorn workers in one scrape (multiprocess mode)
    static_configs:
      - targets: ["backend:8000"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
