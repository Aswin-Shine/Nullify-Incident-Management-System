# ============================================================
# Nullify: Docker Compose (production)
# Services: postgres, redis, backend, frontend
#
# All settings come from the project's single env file, .env at the repo root, which compose
# reads automatically (template: .env.example). DB_HOST/REDIS_HOST/APP_ENV are overridden below.
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nullify-postgres
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-nullify}
      POSTGRES_USER:     ${DB_USER:-nullify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nullify} -d ${DB_NAME:-nullify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nullify-internal
    # NOT exposed to host — only backend can reach it via internal network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nullify-redis
    restart: unless-stopped
    # REDIS_PASSWORD, when set, is required by Redis too (the app, migrate and the exporter already send it).
    command: ["sh", "-c", "exec redis-server --save 60 1 --loglevel warning $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    security_opt: ["no-new-privileges:true"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nullify-internal
    # NOT exposed to host

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build: ./backend          # `docker compose up --build` builds this repo; `docker compose pull` fetches the registry image
    image: aswinshine/nullify-backend:v1
    container_name: nullify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
      DB_NAME:     ${DB_NAME:-nullify}

      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}

      # App
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY missing, set it in .env at the repo root}  # >= 32 random chars or the app refuses to start
      APP_ENV:        production
      # Browser origins allowed for CORS and /ws (JSON list), e.g. '["https://ims.example.com"]'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      # Refresh cookie is Secure by default; set false only while serving plain HTTP (no TLS yet)
      COOKIE_SECURE:   ${COOKIE_SECURE:-true}
      DEBUG:          "false"

      # Observability (optional — comment out if no Jaeger)
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      # Metrics from all 4 workers in one /metrics scrape. The dir is the tmpfs below: empty for a new container,
      # kept across a restart, where the same worker pids reopen their own files and counters carry on.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom

      # Webhooks (optional)
      SLACK_WEBHOOK_URL:       ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY:   ${PAGERDUTY_ROUTING_KEY:-}
    # No host port: nginx (frontend service) is the only entry point, which is what makes
    # trusting X-Forwarded-For (uvicorn --proxy-headers) safe for per-IP rate limits.
    stop_grace_period: 30s  # ingestion drains for up to SHUTDOWN_DRAIN_SECONDS (20s) on SIGTERM
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]         # a non-root app on port 8000 needs no capabilities
    mem_limit: 1536m        # idles near 400 MB; a full queue in every worker must not take the host down
    pids_limit: 256
    volumes:
      # Persist JSONL data lake outside the container
      - data_lake:/app/data_lake
    tmpfs:
      - /tmp/prom:uid=1001,gid=1001,mode=0700   # the image's non-root `nullify` user; a bare tmpfs comes back root-owned 755 after a restart
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Migrations (one-shot job) ──────────────────────────────
  # Runs alembic upgrade head before backend starts
  # Use: docker compose run --rm migrate
  migrate:
    build: ./backend
    image: aswinshine/nullify-backend:v1
    container_name: nullify-migrate
    command: ["alembic", "upgrade", "head"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
      DB_NAME:     ${DB_NAME:-nullify}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY missing, set it in .env at the repo root}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:    ${REDIS_DB:-0}
    networks:
      - nullify-internal
    profiles:
      - migrate   # only runs when explicitly called

  # ── Frontend (React → nginx) ───────────────────────────────
  frontend:
    build: ./frontend
    image: aswinshine/nullify-frontend:v1
    container_name: nullify-frontend
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"   # only service exposed to host
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]  # nginx itself, not backend readiness; localhost resolves to ::1 and nginx listens on IPv4 only
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Monitoring (opt-in: docker compose --profile monitoring up -d) ──
  # Prometheus scrapes the backend and two exporters on the internal network and evaluates the alert rules;
  # Grafana shows the "Nullify overview" dashboard. Both UIs listen on 127.0.0.1 only (an SSH tunnel on a server).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: nullify-prometheus
    security_opt: ["no-new-privileges:true"]
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - nullify-internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: nullify-postgres-exporter
    security_opt: ["no-new-privileges:true"]
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME:-nullify}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-nullify}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-}
    networks:
      - nullify-internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    container_name: nullify-redis-exporter
    security_opt: ["no-new-privileges:true"]
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - nullify-internal

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: nullify-grafana
    security_opt: ["no-new-privileges:true"]
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    # Refuses to start without a password: Grafana would otherwise fall back to admin/admin.
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'Set GRAFANA_ADMIN_PASSWORD in .env'; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nullify-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - nullify-internal

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  data_lake:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  nullify-internal:
    driver: bridge
    internal: false   # backend needs outbound for webhooks (Slack/PD)
