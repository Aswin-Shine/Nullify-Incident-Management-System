# ============================================================
# Nullify: Docker Compose (production)
# Services: postgres, redis, backend, frontend
#
# All settings come from the project's single env file, .env at the repo root, which compose
# reads automatically (template: .env.example). DB_HOST/REDIS_HOST/APP_ENV are overridden below.
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nullify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-nullify}
      POSTGRES_USER:     ${DB_USER:-nullify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nullify} -d ${DB_NAME:-nullify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nullify-internal
    # NOT exposed to host — only backend can reach it via internal network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nullify-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nullify-internal
    # NOT exposed to host

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build: ./backend          # `docker compose up --build` builds this repo; `docker compose pull` fetches the registry image
    image: aswinshine/nullify-backend:v1
    container_name: nullify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
      DB_NAME:     ${DB_NAME:-nullify}

      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}

      # App
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY missing, set it in .env at the repo root}  # >= 32 random chars or the app refuses to start
      APP_ENV:        production
      # Browser origins allowed for CORS and /ws (JSON list), e.g. '["https://ims.example.com"]'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      # Refresh cookie is Secure by default; set false only while serving plain HTTP (no TLS yet)
      COOKIE_SECURE:   ${COOKIE_SECURE:-true}
      DEBUG:          "false"

      # Observability (optional — comment out if no Jaeger)
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}

      # Webhooks (optional)
      SLACK_WEBHOOK_URL:       ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY:   ${PAGERDUTY_ROUTING_KEY:-}
    # No host port: nginx (frontend service) is the only entry point, which is what makes
    # trusting X-Forwarded-For (uvicorn --proxy-headers) safe for per-IP rate limits.
    stop_grace_period: 30s  # ingestion drains for up to SHUTDOWN_DRAIN_SECONDS (20s) on SIGTERM
    volumes:
      # Persist JSONL data lake outside the container
      - data_lake:/app/data_lake
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Migrations (one-shot job) ──────────────────────────────
  # Runs alembic upgrade head before backend starts
  # Use: docker compose run --rm migrate
  migrate:
    build: ./backend
    image: aswinshine/nullify-backend:v1
    container_name: nullify-migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing, set it in .env at the repo root}
      DB_NAME:     ${DB_NAME:-nullify}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY missing, set it in .env at the repo root}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:    ${REDIS_DB:-0}
    networks:
      - nullify-internal
    profiles:
      - migrate   # only runs when explicitly called

  # ── Frontend (React → nginx) ───────────────────────────────
  frontend:
    build: ./frontend
    image: aswinshine/nullify-frontend:v1
    container_name: nullify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"   # only service exposed to host
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]  # nginx itself, not backend readiness; localhost resolves to ::1 and nginx listens on IPv4 only
      interval: 30s
      timeout: 5s
      retries: 3

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  data_lake:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  nullify-internal:
    driver: bridge
    internal: false   # backend needs outbound for webhooks (Slack/PD)
