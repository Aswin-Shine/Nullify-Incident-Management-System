# ============================================================
# Nullify — Docker Compose (production)
# Services: postgres, redis, backend, frontend
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nullify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-nullify}
      POSTGRES_USER:     ${DB_USER:-nullify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nullify} -d ${DB_NAME:-nullify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nullify-internal
    # NOT exposed to host — only backend can reach it via internal network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nullify-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - nullify-internal
    # NOT exposed to host

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    image: aswinshine/nullify-backend:v1
    container_name: nullify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME:     ${DB_NAME:-nullify}

      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}

      # App
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      APP_ENV:        production
      DEBUG:          "false"

      # Observability (optional — comment out if no Jaeger)
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}

      # Webhooks (optional)
      SLACK_WEBHOOK_URL:       ${SLACK_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY:   ${PAGERDUTY_ROUTING_KEY:-}
    ports:
      - "8000:8000"  # Expose backend API to host
    volumes:
      # Persist JSONL data lake outside the container
      - data_lake:/app/data_lake
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Migrations (one-shot job) ──────────────────────────────
  # Runs alembic upgrade head before backend starts
  # Use: docker compose run --rm migrate
  migrate:
    image: aswinshine/nullify-backend:v1
    container_name: nullify-migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_USER:     ${DB_USER:-nullify}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME:     ${DB_NAME:-nullify}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-placeholder}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:    ${REDIS_DB:-0}
    networks:
      - nullify-internal
    profiles:
      - migrate   # only runs when explicitly called

  # ── Frontend (React → nginx) ───────────────────────────────
  frontend:
    image: aswinshine/nullify-frontend:v1
    container_name: nullify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"   # only service exposed to host
    networks:
      - nullify-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  data_lake:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  nullify-internal:
    driver: bridge
    internal: false   # backend needs outbound for webhooks (Slack/PD)
